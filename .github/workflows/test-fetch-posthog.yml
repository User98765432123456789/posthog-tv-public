name: Test fetch PostHog data

# Temporary: validate fetch_posthog_data.py + generate_slides.py against the
# real API before wiring them into the main slide generation workflow.
# Manual only, never commits anything.
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch PostHog KPIs
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: python scripts/fetch_posthog_data.py

      - name: Show fetched JSON
        run: cat data/posthog_data.json

      - name: Generate slide HTML
        run: python scripts/generate_slides.py

      - name: Show generated HTML
        run: cat output/slide_contrats.html

      - name: Upload generated HTML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: slide-contrats-html
          path: output/slide_contrats.html
